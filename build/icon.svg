<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d24"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8aff"/>
      <stop offset="100%" stop-color="#2f6bff"/>
    </linearGradient>
  </defs>
  <!-- bg -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- glass sheen -->
  <rect width="512" height="512" rx="108" fill="url(#shine)"/>
  <!-- inner border -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- S letter -->
  <text x="256" y="310" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,sans-serif" font-size="260" font-weight="700" fill="url(#accent)" text-anchor="middle" letter-spacing="-12">S</text>
  <!-- accent dot -->
  <circle cx="390" cy="170" r="22" fill="#2f6bff" opacity="0.9"/>
  <!-- bottom bar -->
  <rect x="120" y="370" width="272" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
</svg>
